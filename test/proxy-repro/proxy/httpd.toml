# Models blackpearl edge: TLS terminate + proxy to loopback upstream (socat → backend).
[server]
listen = ":8443"
document_root = "/empty"

[server.tls]
mode = "self_signed"
cert_dir = "/certs"
min_protocol = "1.3"
terminate = true

[server.tls.self_signed]
dev = true
valid_days = 30

[limits]
max_body = "1m"
max_header = "32k"
proxy_max_response_body = "64m"
concurrent_streams = 32
stream_idle_timeout = "300s"
stream_max_duration = "3600s"

[upstreams.gitlab]
balance = "round_robin"
peers = ["http://backend:8080"]

[routes]
"GET /users/sign_in" = "proxy:gitlab"
"GET /assets/*" = "proxy:gitlab"
