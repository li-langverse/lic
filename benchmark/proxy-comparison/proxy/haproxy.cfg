global
    maxconn 4096
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  300s
    timeout server  300s

frontend tls_front
    bind *:8443 ssl crt /certs/combined.pem
    default_backend static_backend

backend static_backend
    balance roundrobin
    server backend backend:8080 check
