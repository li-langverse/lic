[package.repository]
url = "https://github.com/li-langverse/li-asic"
documentation = "https://li-langverse.github.io/li-language/ecosystem/li-asic/"
changelog = "https://github.com/li-langverse/li-asic/blob/main/CHANGELOG.md"
