# Minimal edge chain: client → li-httpd (TLS) → nginx (static ~835KB CSS).
services:
  backend:
    build:
      context: ../..
      dockerfile: test/proxy-repro/Dockerfile.backend
    networks: [repro]

  proxy:
    build:
      context: ../..
      dockerfile: test/proxy-repro/Dockerfile.proxy
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sk", "--http1.1", "--resolve", "gitlab.lilangverse.xyz:8443:127.0.0.1", "-o", "/dev/null", "https://gitlab.lilangverse.xyz:8443/users/sign_in"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s
    ports:
      - "18443:8443"
    networks: [repro]

  tester:
    image: curlimages/curl:8.12.1
    depends_on:
      proxy:
        condition: service_healthy
    networks: [repro]
    volumes:
      - ./run-test.sh:/run-test.sh:ro
      - ./parallel-run-test.sh:/parallel-run-test.sh:ro
      - ../proxy/proxy-curl-env.sh:/proxy-curl-env.sh:ro
      - ../proxy-relay/test_parallel_same_asset.sh:/relay-same.sh:ro
      - ../proxy-relay/test_parallel_multi_asset.sh:/relay-multi.sh:ro
    entrypoint: ["/bin/sh", "-c", "/run-test.sh && PROXY_HOST=proxy PROXY_PORT=8443 PROXY_VHOST=gitlab.lilangverse.xyz sh /parallel-run-test.sh && PROXY_HOST=proxy PROXY_PORT=8443 PROXY_VHOST=gitlab.lilangverse.xyz PARALLEL_N=6 sh /relay-same.sh && PROXY_HOST=proxy PROXY_PORT=8443 PROXY_VHOST=gitlab.lilangverse.xyz sh /relay-multi.sh"]
    environment:
      PROXY_HOST: proxy
      PROXY_PORT: "8443"
      PROXY_VHOST: gitlab.lilangverse.xyz
      EXPECTED_BYTES: "835437"
      RUNS: "10"

networks:
  repro:
