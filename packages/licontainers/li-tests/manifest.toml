# Package-local tests — also register in monorepo li-tests/manifest.toml when integrated.

[[tests]]
suite = "smoke"
file = "smoke/builds.li"
outcome = "verify_ok"
note = "T-PKG-licontainers-smoke"

[[tests]]
suite = "integration"
file = "integration/cri_lifecycle.li"
outcome = "verify_ok"
note = "T-PKG-licontainers-cri-lifecycle"

[[tests]]
suite = "integration"
file = "integration/cri_socket_smoke.li"
outcome = "verify_ok"
note = "T-PKG-licontainers-cri-socket-smoke"

[[tests]]
suite = "integration"
file = "integration/remote_cri.li"
outcome = "verify_ok"
note = "T-PKG-licontainers-remote-cri"
