worker_processes 1;
events { worker_connections 64; }
http {
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server {
    listen 8080;
    root /srv/www;
    location / {
      default_type text/html;
    }
    location ~ \.css$ {
      default_type text/css;
    }
    location ~ \.js$ {
      default_type application/javascript;
    }
    location ~ \.woff2$ {
      default_type font/woff2;
    }
  }
}
