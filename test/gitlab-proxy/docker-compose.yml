# GitLab container proxy integration: curl → li-httpd TLS → nginx (GitLab sign_in mimic).
services:
  backend:
    build:
      context: ../..
      dockerfile: test/gitlab-proxy/Dockerfile.backend
    networks: [gitlab]

  proxy:
    build:
      context: ../..
      dockerfile: test/gitlab-proxy/Dockerfile.proxy
    depends_on:
      backend:
        condition: service_started
    ports:
      - "19543:8443"
    networks: [gitlab]

  tester:
    image: curlimages/curl:8.12.1
    depends_on:
      proxy:
        condition: service_started
    networks: [gitlab]
    volumes:
      - ./test-gitlab-parallel.sh:/test.sh:ro
      - ../proxy/proxy-curl-env.sh:/proxy-curl-env.sh:ro
    entrypoint: ["/bin/sh", "-c", "sleep 3 && PROXY_HOST=proxy PROXY_PORT=8443 PROXY_VHOST=gitlab.test sh /test.sh"]

networks:
  gitlab:
