# TLS edge reverse proxy — parallel static asset relay (GitLab/Next.js pattern).
# Run: li-httpd validate-config tls_proxy_edge.toml
# Pair with test/proxy-repro or test/nextjs-proxy integration scripts.
[server]
listen = ":8443"
document_root = "/empty"
workers = 2

[server.tls]
mode = "self_signed"
cert_dir = "./certs"
min_protocol = "1.3"
terminate = true

[server.tls.self_signed]
dev = true

[limits]
max_body = "1m"
max_header = "32k"
proxy_max_response_body = "64m"
concurrent_streams = 32
stream_idle_timeout = "300s"
stream_max_duration = "3600s"

[upstreams.app]
balance = "round_robin"
peers = ["http://127.0.0.1:3000"]

[routes]
"GET /users/sign_in" = "proxy:app"
"GET /assets/*" = "proxy:app"
"GET /_next/static/*" = "proxy:app"
