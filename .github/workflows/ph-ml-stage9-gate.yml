name: PH-ML Stage 9 gate

on:
  pull_request:
    paths:
      - "packages/li-llm/**"
      - "packages/li-ml/**"
      - "scripts/ph-ml-stage9-gates.sh"
      - "scripts/ph-ml-hpc-ai-library-gates.sh"
      - "scripts/bench-ph-ml-competitor-llm-all.sh"
      - "scripts/bench_ph_ml_competitor_*.py"
      - "scripts/bench-ph-ml-llm-transformer-multilayer-parity.sh"
      - "scripts/bench_ph_ml_transformer_multilayer_reference.py"
  workflow_dispatch:

concurrency:
  group: ph-ml-stage9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage9-stretch-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout benchmarks sibling
        run: |
          chmod +x scripts/checkout-ecosystem-siblings.sh
          ./scripts/checkout-ecosystem-siblings.sh

      - name: Install LLVM 22
        run: |
          chmod +x scripts/ci-install-llvm.sh
          sudo LI_LLVM_MAJOR=22 bash scripts/ci-install-llvm.sh

      - name: Build lic
        env:
          LLVM_DIR: /usr/lib/llvm-22/lib/cmake/llvm
          CC: clang-22
          CXX: clang++-22
        run: ./scripts/build.sh

      - name: PH-ML Stage 9 stretch gate
        env:
          CC: clang-22
          CXX: clang++-22
          PH_ML_STAGE9_INNER: "1"
        run: |
          chmod +x scripts/ph-ml-stage9-gates.sh scripts/ph-ml-stage8-gates.sh \
            scripts/ph-ml-stage7-gates.sh scripts/bench-ph-ml-competitor-llm-all.sh \
            scripts/bench-ph-ml-llm-transformer-multilayer-parity.sh \
            scripts/bench-ph-ml-llm-kv-gpu-cluster.sh scripts/lig-emit-vendor-stub.sh
          bash scripts/ph-ml-stage9-gates.sh

      - name: Optional LLM competitor deps (honest skip when absent)
        continue-on-error: true
        run: |
          python3 -m pip install -q transformers torch || true
          bash scripts/bench-ph-ml-competitor-llm-all.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("ph-ml-competitor-llamacpp.json", "ph-ml-competitor-vllm.json", "ph-ml-competitor-transformers.json"):
              row = json.loads(Path("benchmarks/results", name).read_text())
              assert "executed" in row and row.get("note"), name
              print(name, "executed=", row["executed"], "note=", row["note"][:60])
          PY
