# Two-backend LB e2e: proxy-lb → backend-a / backend-b (X-Li-Backend markers).
# Set LB_POLICY=round_robin|least_conn|ip_hash before compose up.
services:
  backend-a:
    build:
      context: ../..
      dockerfile: test/proxy-repro/Dockerfile.backend
    networks: [repro]

  backend-b:
    build:
      context: ../..
      dockerfile: test/proxy-repro/Dockerfile.backend-b
    networks: [repro]

  proxy-lb:
    build:
      context: ../..
      dockerfile: test/proxy-repro/Dockerfile.proxy-lb
    depends_on:
      backend-a:
        condition: service_started
      backend-b:
        condition: service_started
    ports:
      - "18444:8443"
    networks: [repro]
    environment:
      LB_POLICY: "${LB_POLICY:-ip_hash}"

  lb-tester:
    image: curlimages/curl:8.12.1
    depends_on:
      proxy-lb:
        condition: service_started
    networks: [repro]
    volumes:
      - ./test-lb-e2e.sh:/test-lb-e2e.sh:ro
      - ../proxy/proxy-curl-env.sh:/proxy-curl-env.sh:ro
    entrypoint: ["/bin/sh", "-c", "sleep 2 && PROXY_HOST=proxy-lb PROXY_PORT=8443 LB_POLICY=${LB_POLICY:-ip_hash} sh /test-lb-e2e.sh"]
    environment:
      PROXY_HOST: proxy-lb
      PROXY_PORT: "8443"
      LB_POLICY: "${LB_POLICY:-ip_hash}"

networks:
  repro:
