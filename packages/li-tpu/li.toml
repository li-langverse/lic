[package]
name = "li-tpu"
version = "0.1.0"
edition = "2026"
license = "Apache-2.0 OR MIT"
description = "Li TPU device layer — backend probe and orchestration hooks (import litpu)"

[package.metadata.li]
github_repo = "li-tpu"
import_name = "litpu"
min_lic = "0.1.0"
maintainer = "li-langverse"
pkg_id = "PKG-li-tpu"

[package.metadata.studio]
device_probe = "bench/device_probe.toml"
bench_hook = "packages/li-tpu/bench/device_probe.toml"

[package.repository]
url = "https://github.com/li-langverse/li-tpu"
documentation = "https://li-langverse.github.io/li-language/ecosystem/li-tpu/"
changelog = "https://github.com/li-langverse/li-tpu/blob/main/CHANGELOG.md"
