# Two loopback upstream peers (socat → backend-a / backend-b). ip_hash must pin one client IP.
[server]
listen = ":8443"
document_root = "/empty"

[server.tls]
mode = "self_signed"
cert_dir = "/certs"
min_protocol = "1.3"
terminate = true

[server.tls.self_signed]
dev = true
valid_days = 30

[limits]
max_body = "1m"
max_header = "32k"
proxy_max_response_body = "64m"

[upstreams.gitlab]
policy = "ip_hash"
peers = ["http://127.0.0.1:18080", "http://127.0.0.1:18081"]

[routes]
"GET /users/sign_in" = "proxy:gitlab"
"GET /assets/*" = "proxy:gitlab"
"GET /probe" = "proxy:gitlab"
