[package]
name = "li-asic"
version = "0.1.0"
edition = "2026"
license = "Apache-2.0 OR MIT"
description = "Li ASIC/FPGA device layer — backend probe and orchestration hooks (import liasic)"

[package.metadata.li]
github_repo = "li-asic"
import_name = "liasic"
min_lic = "0.1.0"
maintainer = "li-langverse"
